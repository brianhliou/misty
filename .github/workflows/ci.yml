# Python CI: the `just check` gate, on every push/PR.
#
# Mirrors the local pre-push gate: build the fow_rust extension, hard-gate on
# rust health (FOW_REQUIRE_RUST — a missing/partial extension must FAIL, not
# silently skip the parity suite), then run the full test suite with Stockfish
# installed (without it, 76 tests skip and the suite proves much less).
#
# Lint is blocking (tree went ruff-clean 2026-08-22).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Stockfish 18 (version-pinned)
        # The golden pick traces and opening-sanity tests are sensitive to the
        # leaf evaluator's version; apt's Stockfish differs by distro and broke
        # them. ensure_sf18 provisions the official SF18 release binary — the
        # version the traces were generated with.
        run: |
          SF="$(python3 scripts/ensure_sf18.py)"
          sudo ln -sf "$SF" /usr/local/bin/stockfish
          echo "FOW_STOCKFISH=$SF" >> "$GITHUB_ENV"

      - name: Verify Stockfish on PATH
        run: command -v stockfish && stockfish --help < /dev/null | head -1 || true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fow_rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('fow_rust/Cargo.lock') }}

      - name: Install package + native extension
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'
          pip install ./fow_rust

      - name: Rust extension health gate
        run: FOW_REQUIRE_RUST=1 python -m fow_chess.rust_health

      - name: Tests (full suite, incl. slow + parity)
        run: pytest -q -n auto

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fow_rust/target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('fow_rust/Cargo.lock') }}
      # pyo3 links libpython here (extension-module is only enabled by
      # maturin builds), so the runner's python3 satisfies the link.
      - run: cargo test --manifest-path fow_rust/Cargo.toml
      # The chess-only configuration the public export ships (variant
      # features off) must keep compiling and passing.
      - run: cargo test --manifest-path fow_rust/Cargo.toml --no-default-features

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install 'ruff>=0.6'
      - run: ruff check src scripts
